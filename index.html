<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Todo App</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f4;
    color: #1c1917;
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
  }
  h1 { font-size: 22px; margin-bottom: 20px; }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d6d3d1;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    padding: 10px 14px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .add-btn { background: #1c1917; color: white; }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #e7e5e4;
  }
  .todo-title {
    flex: 1;
    font-size: 15px;
  }
  .completed .todo-title {
    text-decoration: line-through;
    color: #a8a29e;
  }
  .edit-input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid #d6d3d1;
    border-radius: 4px;
    font-size: 14px;
  }
  .icon-btn {
    background: none;
    padding: 4px 8px;
    font-size: 13px;
    color: #57534e;
  }
  .icon-btn.delete { color: #b91c1c; }
  .empty { color: #a8a29e; font-size: 14px; padding: 20px 0; text-align: center; }
  .error { color: #b91c1c; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="root"></div>

<!-- React, ReactDOM, and Babel from CDN. Babel lets the browser understand JSX directly, no build step needed. -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;


const API_URL = "http://localhost:3001/todos";

function App() {
  const [todos, setTodos] = useState([]);         // the list of todos from the DB
  const [newTitle, setNewTitle] = useState("");    // text currently typed in the "add" box
  const [error, setError] = useState("");          // any error message to show
  const [editingId, setEditingId] = useState(null);// which todo (by _id) is being edited, if any
  const [editTitle, setEditTitle] = useState("");   // text currently typed in the "edit" box

  // FETCH ALL TODOS 
  const loadTodos = async () => {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error("Failed to load todos");
      const data = await res.json();
      setTodos(data);
    } catch (err) {
      setError(err.message);
    }
  };

  // trigger the initial fetch.
  useEffect(() => {
    loadTodos();
  }, []);

  //CREATE
  const handleAdd = async (e) => {
    e.preventDefault();
    if (!newTitle.trim()) return;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: newTitle }),
      });
      if (!res.ok) {
        const body = await res.json();
        throw new Error(body.message || "Failed to add todo");
      }
      setNewTitle("");   // clear the input
      setError("");
      loadTodos();        // re-fetch so the UI reflects the DB
    } catch (err) {
      setError(err.message);
    }
  };

  // DELETE 
  const handleDelete = async (id) => {
    try {
      const res = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      if (!res.ok) throw new Error("Failed to delete todo");
      loadTodos();
    } catch (err) {
      setError(err.message);
    }
  };

  // UPDATE: toggle completed on/off 
  const handleToggleComplete = async (todo) => {
    try {
      const res = await fetch(`${API_URL}/${todo._id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ completed: !todo.completed }),
      });
      if (!res.ok) throw new Error("Failed to update todo");
      loadTodos();
    } catch (err) {
      setError(err.message);
    }
  };

  //UPDATE: edit the title 
  const startEditing = (todo) => {
    setEditingId(todo._id);
    setEditTitle(todo.title);
  };

  const cancelEditing = () => {
    setEditingId(null);
    setEditTitle("");
  };

  const saveEdit = async (id) => {
    if (!editTitle.trim()) return;
    try {
      const res = await fetch(`${API_URL}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: editTitle }),
      });
      if (!res.ok) throw new Error("Failed to update todo");
      cancelEditing();
      loadTodos();
    } catch (err) {
      setError(err.message);
    }
  };

  // RENDER 
  return (
    <div>
      <h1>Aaawee's Todos</h1>

      {error && <div className="error">{error}</div>}

      {/* Create form. This is a "controlled input" */}
      <form onSubmit={handleAdd}>
        <input
          type="text"
          placeholder="What needs doing?"
          value={newTitle}
          onChange={(e) => setNewTitle(e.target.value)}
        />
        <button className="add-btn" type="submit">Add</button>
      </form>

      {todos.length === 0 && <div className="empty">No todos yet — add one above.</div>}

      {/* .map() turns each todo object into a piece of UI.
          The "key" prop helps React track which item is which across re-renders. */}
      {todos.map((todo) => (
        <div key={todo._id} className={`todo-item ${todo.completed ? "completed" : ""}`}>
          <input
            type="checkbox"
            checked={todo.completed}
            onChange={() => handleToggleComplete(todo)}
          />

          {editingId === todo._id ? (
            // Edit mode: show a text input + save/cancel
            <>
              <input
                className="edit-input"
                type="text"
                value={editTitle}
                onChange={(e) => setEditTitle(e.target.value)}
                autoFocus
              />
              <button className="icon-btn" onClick={() => saveEdit(todo._id)}>Save</button>
              <button className="icon-btn" onClick={cancelEditing}>Cancel</button>
            </>
          ) : (
            // Normal mode: show the title + edit/delete buttons
            <>
              <span className="todo-title">{todo.title}</span>
              <button className="icon-btn" onClick={() => startEditing(todo)}>Edit</button>
              <button className="icon-btn delete" onClick={() => handleDelete(todo._id)}>Delete</button>
            </>
          )}
        </div>
      ))}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

</body>
</html>
